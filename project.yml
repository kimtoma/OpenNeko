name: OpenNeko
options:
  bundleIdPrefix: com.kimtoma
  deploymentTarget:
    macOS: "14.0"
packages:
  OpenNekoKit:
    path: .
targets:
  OpenNeko:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/sprites/**
          - Resources/skills/**
      - path: App/Resources/sprites
        type: folder
        buildPhase: resources
      - path: App/Resources/skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: OpenNekoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimtoma.openneko
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
