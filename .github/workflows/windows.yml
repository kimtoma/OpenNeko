name: Windows

on:
  pull_request:
    paths:
      - "windows/**"
      - "App/Resources/**"
      - ".github/workflows/windows.yml"
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - "App/Resources/**"
      - ".github/workflows/windows.yml"

jobs:
  test-build:
    name: .NET test and Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Core tests
        run: dotnet test windows/tests/OpenNeko.Core.Tests -c Release

      - name: Build app
        run: dotnet build windows/src/OpenNeko.Windows -c Release

      - name: Publish self-contained app
        run: >
          dotnet publish windows/src/OpenNeko.Windows -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o windows/artifacts/OpenNeko-Windows-x64

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OpenNeko-Windows-x64
          path: windows/artifacts/OpenNeko-Windows-x64
          if-no-files-found: error
